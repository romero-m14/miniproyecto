<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos - Miguel Romero</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <script src="./script/darkmoon.js"></script>
    <!-- Enlazado correctamente a tu nuevo archivo proyectos1.js -->
    <script type="module" src="./script/proyectos1.js"></script>
  </head>
  <body
    id="body"
    class="bg-slate-50 text-slate-900 dark:bg-[#020617] min-h-screen dark:text-white overflow-x-hidden transition-colors duration-300"
  >
    <header
      class="w-full px-6 md:px-14 py-6 flex items-center justify-between border-b border-slate-200/80 dark:border-zinc-800/50 transition-colors relative"
    >
      <!-- Blindaje max-w-[280px] aquí también para que no se corte en Proyectos -->
      <div class="flex items-center gap-2 max-w-[280px] h-12 overflow-hidden">
        <img id="header-logo" src="./galeria/logo1.png" alt="Logo" class="max-w-full max-h-full object-contain" />
        <span
          class="text-sm font-bold tracking-widest text-slate-800 dark:text-slate-200 whitespace-nowrap"
          >Miguel Romero</span
        >
      </div>

      <nav
        id="menu-navegacion"
        class="hidden md:flex flex-col md:flex-row absolute md:relative top-full left-0 w-full md:w-auto bg-slate-50 dark:bg-[#020617] md:bg-transparent p-6 md:p-0 gap-6 md:gap-10 text-xs uppercase font-medium text-slate-600 dark:text-gray-300 border-b md:border-none border-slate-200 dark:border-zinc-800 z-50 transition-all"
      >
        <a
          href="index.html"
          class="hover:text-lime-600 dark:hover:text-lime-300 transition"
          >Acerca de mí</a
        >
        <a
          href="index.html#habilidades-section"
          class="hover:text-lime-600 dark:hover:text-lime-300 transition"
          >Habilidades</a
        >
        <a
          href="#"
          class="text-lime-600 dark:hover:text-lime-300 transition"
          >Proyectos</a
        >
      </nav>

      <div class="flex items-center gap-4">
        <button
          id="btndark"
          class="bg-slate-200 hover:bg-slate-300 dark:bg-zinc-800/50 text-slate-800 dark:text-stone-100 w-10 h-10 flex items-center justify-center rounded-full border border-slate-300 dark:border-zinc-700/50 hover:scale-110 transition-all cursor-pointer backdrop-blur-sm"
        >
          <span class="dark:hidden text-base">🌙</span>
          <span class="hidden dark:block text-base">☀️</span>
        </button>
        <button
          id="btn-menu"
          class="block md:hidden text-xl p-2 focus:outline-none dark:text-white"
        >
          ☰
        </button>
        <button
          class="border border-lime-600 text-lime-600 dark:border-lime-300 dark:text-lime-300 px-5 py-2 rounded-full text-xs font-semibold hover:bg-lime-600 hover:text-white dark:hover:bg-lime-300 dark:hover:text-black transition"
        >
          Contacto
        </button>
      </div>
    </header>

    <main class="px-6 md:px-14 py-16 max-w-6xl mx-auto">
      <div class="text-center mb-16">
        <h1 class="text-3xl md:text-5xl font-black text-slate-900 dark:text-white tracking-tight">
          Mis <span class="text-lime-600 dark:text-lime-300 italic font-serif font-normal">Proyectos</span> Destacados
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">
          Una colección de mis trabajos más recientes cargados de forma dinámica.
        </p>
      </div>

      <div id="contenedor-proyectos" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
    </main>
  </body>
</html>
